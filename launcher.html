<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PolyDash Live Loader</title>
  <style>
    :root {
      --bg: #070d18;
      --panel: rgba(15, 23, 42, 0.82);
      --line: rgba(125, 211, 252, 0.32);
      --text: #e2e8f0;
      --accent: #7dd3fc;
      --muted: #a5b4cf;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at top, #132238 0%, var(--bg) 55%, #040914 100%);
      color: var(--text);
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      position: relative;
      display: block;
    }

    #launcher-ui {
      position: fixed;
      inset: 0;
      z-index: 20;
      pointer-events: none;
      display: grid;
      place-items: center;
    }

    .loader {
      width: min(520px, 90vw);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 28px 24px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.35);
      text-align: center;
    }

    .title {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 1px;
      margin-bottom: 12px;
      color: #ffffff;
    }

    .subtitle {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 20px;
    }

    .status {
      display: inline-block;
      padding: 12px 18px;
      border-radius: 999px;
      background: rgba(125, 211, 252, 0.08);
      border: 1px solid rgba(125, 211, 252, 0.24);
      color: var(--accent);
      font-weight: 700;
      letter-spacing: 0.8px;
      min-width: 220px;
    }

    .error {
      color: #fca5a5;
      border-color: rgba(248, 113, 113, 0.38);
      background: rgba(127, 29, 29, 0.18);
    }
  </style>
</head>
<body>
  <div id="launcher-ui">
    <div class="loader">
      <div class="title">PolyDash Live</div>
      <div class="subtitle">Loading latest repo build and assets...</div>
      <div id="status" class="status">Connecting...</div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>

  <script>
    const branch = 'improve-polydash';
    const base = `https://cdn.jsdelivr.net/gh/DeOptN0/PolyDash@${branch}/`;
    const statusEl = document.getElementById('status');

    function setStatus(text, isError = false) {
      statusEl.textContent = text;
      statusEl.classList.toggle('error', isError);
    }

    function ensureGameDom() {
      const existing = document.getElementById('canvas-container');
      if (existing) return;

      const hud = document.createElement('div');
      hud.id = 'hud';
      hud.innerHTML = `
        <div class="title">POLYDASH <span style="color:#7dd3fc">BETA</span></div>
        <div class="speed-row">
          <span id="speed-display">0</span>
          <span class="unit">KM/H</span>
        </div>
        <div id="track-display">Track: Harbor Loop</div>
        <div id="car-display">Car: Starter GT</div>
        <div id="lap-display">Lap 1 • 0:00.0 • Best --:--.-</div>
        <div id="status-text">Ready</div>
        <div id="controls-hint">W / S drive · A / D steer · SPACE brake · R reset</div>
      `;

      const versionBadge = document.createElement('div');
      versionBadge.id = 'version-badge';
      versionBadge.textContent = 'v0.1.0-beta';

      const canvasContainer = document.createElement('div');
      canvasContainer.id = 'canvas-container';

      document.body.appendChild(hud);
      document.body.appendChild(versionBadge);
      document.body.appendChild(canvasContainer);

      const style = document.createElement('style');
      style.textContent = `
        body { margin: 0; overflow: hidden; background: radial-gradient(circle at top, #dfeeff 0%, #94b9ff 28%, #101827 100%); }
        #canvas-container { width: 100vw; height: 100vh; }
        #hud {
          position: absolute; top: 22px; left: 22px; z-index: 10; color: #f8fafc;
          background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(103, 232, 249, 0.38);
          border-radius: 16px; padding: 16px 20px 14px 20px; backdrop-filter: blur(12px);
          box-shadow: 0 12px 32px rgba(0,0,0,0.25); pointer-events: none;
        }
        .title { font-size: 12px; letter-spacing: 3px; font-weight: 800; color: #f472b6; margin-bottom: 8px; }
        .speed-row { display: flex; align-items: flex-end; gap: 8px; }
        #speed-display { font-size: 42px; font-weight: 900; color: #67e8f9; line-height: 1; }
        .unit { font-size: 12px; text-transform: uppercase; letter-spacing: 2px; color: #b6c2d9; margin-bottom: 7px; }
        #track-display, #car-display, #lap-display, #status-text { margin-top: 7px; font-size: 12px; color: #dbeafe; letter-spacing: 0.8px; text-transform: uppercase; }
        #controls-hint { margin-top: 8px; font-size: 11px; color: #b6c2d9; letter-spacing: 0.4px; }
        #version-badge { position: absolute; right: 18px; bottom: 18px; z-index: 10; font-size: 11px; letter-spacing: 1.5px; color: rgba(255,255,255,0.5); background: rgba(15,23,42,0.5); border: 1px solid rgba(255,255,255,0.12); padding: 6px 10px; border-radius: 999px; }
        canvas { display: block; }
      `;
      document.head.appendChild(style);
    }

    async function fetchText(path) {
      const response = await fetch(base + path, { cache: 'no-store' });
      if (!response.ok) {
        throw new Error(`Failed to load ${path}: ${response.status} ${response.statusText}`);
      }
      return response.text();
    }

    async function loadAssetImage(path) {
      const response = await fetch(base + path, { cache: 'no-store' });
      if (!response.ok) {
        throw new Error(`Failed to load asset ${path}: ${response.status} ${response.statusText}`);
      }
      const blob = await response.blob();
      return URL.createObjectURL(blob);
    }

    async function loadGame() {
      ensureGameDom();
      document.getElementById('launcher-ui').style.display = 'none';

      const files = [
        'src/content.js',
        'src/vehicle.js',
        'src/tracks.js',
        'src/engine.js',
        'src/ui.css'
      ];

      const loadedScripts = [];

      for (const file of files) {
        if (file.endsWith('.css')) {
          const css = await fetchText(file);
          const style = document.createElement('style');
          style.textContent = css;
          document.head.appendChild(style);
        } else {
          const scriptText = await fetchText(file);
          loadedScripts.push(scriptText);
        }
      }

      const script = document.createElement('script');
      script.textContent = loadedScripts.join('\n');
      document.body.appendChild(script);

      try {
        const starterCar = await loadAssetImage('assets/car-template.svg');
        const starterTrack = await loadAssetImage('assets/track-template.svg');

        const preview = document.createElement('img');
        preview.src = starterCar;
        preview.style.position = 'fixed';
        preview.style.right = '32px';
        preview.style.bottom = '32px';
        preview.style.width = '180px';
        preview.style.borderRadius = '12px';
        preview.style.border = '1px solid rgba(125, 211, 252, 0.3)';
        preview.style.background = 'rgba(0,0,0,0.2)';
        preview.style.boxShadow = '0 20px 40px rgba(0,0,0,0.25)';
        preview.style.display = 'block';
        preview.style.zIndex = '15';
        document.body.appendChild(preview);

        const trackPreview = document.createElement('img');
        trackPreview.src = starterTrack;
        trackPreview.style.position = 'fixed';
        trackPreview.style.left = '32px';
        trackPreview.style.bottom = '32px';
        trackPreview.style.width = '180px';
        trackPreview.style.borderRadius = '12px';
        trackPreview.style.border = '1px solid rgba(125, 211, 252, 0.3)';
        trackPreview.style.background = 'rgba(0,0,0,0.2)';
        trackPreview.style.boxShadow = '0 20px 40px rgba(0,0,0,0.25)';
        trackPreview.style.display = 'block';
        trackPreview.style.zIndex = '15';
        document.body.appendChild(trackPreview);
      } catch (assetErr) {
        console.warn('Example assets not found yet, continuing without preview art.', assetErr);
      }

      setStatus('Latest build loaded successfully');
    }

    loadGame().catch((err) => {
      console.error(err);
      setStatus('Failed to load latest repo build', true);
    });
  </script>
</body>
</html>
