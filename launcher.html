<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PolyDash Live Loader</title>
  <style>
    :root {
      --bg-1: #0a1020;
      --bg-2: #111827;
      --panel: rgba(15, 23, 42, 0.78);
      --line: rgba(125, 211, 252, 0.38);
      --text: #e5eefb;
      --muted: #a8bad7;
      --accent: #7dd3fc;
      --danger: #fca5a5;
      --good: #86efac;
      --shadow: rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: radial-gradient(circle at top, #152840 0%, var(--bg-1) 45%, var(--bg-2) 100%);
      color: var(--text);
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      position: relative;
      display: block;
    }

    #game-frame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      z-index: 1;
      background: #000;
      display: block;
    }

    #launcher-ui {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      background: rgba(3, 7, 18, 0.72);
      backdrop-filter: blur(8px);
      transition: opacity 180ms ease;
    }

    #launcher-ui.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loader {
      width: min(540px, 90vw);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 28px 24px;
      box-shadow: 0 24px 60px var(--shadow);
      text-align: center;
    }

    .title-large {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 1px;
      margin-bottom: 10px;
      color: white;
    }

    .subtitle {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 18px;
    }

    .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(125, 211, 252, 0.3);
      border-top-color: var(--accent);
      border-radius: 50%;
      margin-right: 10px;
      vertical-align: middle;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .status {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 18px;
      border-radius: 999px;
      background: rgba(125, 211, 252, 0.08);
      border: 1px solid rgba(125, 211, 252, 0.26);
      color: var(--accent);
      font-weight: 700;
      letter-spacing: 0.8px;
      min-width: 240px;
    }

    .status.error {
      color: var(--danger);
      border-color: rgba(248, 113, 113, 0.38);
      background: rgba(127, 29, 29, 0.18);
    }

    .status.success {
      color: var(--good);
      border-color: rgba(134, 239, 172, 0.3);
      background: rgba(20, 83, 45, 0.18);
    }
  </style>
</head>
<body>
  <iframe id="game-frame" title="PolyDash Game" allow="fullscreen"></iframe>

  <div id="launcher-ui">
    <div class="loader">
      <div class="title-large">PolyDash Live</div>
      <div class="subtitle">Loading latest repo build from the correct branch...</div>
      <div id="status" class="status"><span class="spinner"></span>Connecting...</div>
    </div>
  </div>

  <script>
    const branch = new URLSearchParams(window.location.search).get('branch') || 'improve-polydash';
    const rawBase = `https://raw.githubusercontent.com/DeOptN0/PolyDash/${branch}/`;
    const gameFrame = document.getElementById('game-frame');
    const launcherUi = document.getElementById('launcher-ui');
    const statusEl = document.getElementById('status');

    function setStatus(text, kind = 'info') {
      statusEl.innerHTML = `${kind === 'loading' ? '<span class="spinner"></span>' : ''}${text}`;
      statusEl.classList.remove('error', 'success');
      if (kind === 'error') statusEl.classList.add('error');
      if (kind === 'success') statusEl.classList.add('success');
    }

    async function loadGameFromBranch() {
      setStatus('Loading build from branch: ' + branch, 'loading');

      const distUrl = rawBase + 'dist/PolyDash-Beta.html';
      const probe = await fetch(distUrl, { cache: 'no-store' });

      if (!probe.ok) {
        throw new Error(`Build missing on branch "${branch}" (${probe.status})`);
      }

      gameFrame.src = distUrl;

      gameFrame.addEventListener('load', () => {
        setStatus('Latest build loaded successfully', 'success');
        setTimeout(() => {
          launcherUi.classList.add('hidden');
        }, 250);
      }, { once: true });
    }

    loadGameFromBranch().catch((err) => {
      console.error(err);
      setStatus('Failed to load the correct branch build', 'error');
    });
  </script>
</body>
</html>
